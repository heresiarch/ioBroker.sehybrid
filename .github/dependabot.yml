# Dependabot configuration
# Cooldown delays updating normal npm dependencies by 7 days but allows security updates to be processed immediately.
# Note: Cooldown is not supported for the github-actions ecosystem.
# Reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: !!int '2'
updates:

  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/src-admin'
    schedule:
      interval: 'monthly'
      time: '00:05'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: !!int '5'
    assignees:
      - 'heresiarch'
    versioning-strategy: 'increase'
    cooldown:
      default-days: !!int '7'
    ignore:
      # @types/node must track the Node.js runtime, not jump majors on its own.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # typescript majors (e.g. 5.x -> 7.x) can break the build; bump manually.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '00:05'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: !!int '5'
    assignees:
      - 'heresiarch'
